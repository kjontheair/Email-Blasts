name: Send Pawsitive Vibes

on:
  push:
    branches: [main]
    paths: ["issues/**"]
  workflow_dispatch:

permissions:
  contents: write   # lets the robot save a "sent" receipt

concurrency:
  group: send-newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml
      - name: Hand issues marked "send" to Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python engine/send.py
      - name: Save receipts so nothing sends twice
        run: |
          git config user.name "Pawsitive Vibes robot"
          git config user.email "actions@users.noreply.github.com"
          git add sent/
          git diff --cached --quiet || (git commit -m "Receipt: issue handed to Kit" && git push)
