name: Check Kit connection

on:
  push:
    branches: [main]
    paths: ["checks/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask Kit for account and tags
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python engine/check.py
      - name: Save report
        run: |
          git config user.name "Pawsitive Vibes robot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || (git commit -m "Kit connection report" && git pull --rebase && git push)
