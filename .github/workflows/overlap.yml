name: Check list overlap

on:
  push:
    branches: [main]
    paths: ["checks/overlap.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overlap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml
      - name: Count other tags for protected-list people
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python engine/overlap.py
      - name: Save report
        run: |
          git config user.name "Pawsitive Vibes robot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || (git commit -m "List overlap report" && git pull --rebase && git push)
